/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* functional inline SVG icons opt into bounded geometry; content SVGs keep their own */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}

/* Home layout: equal-height app and widget columns */
.home-content{display:grid;grid-template-columns:minmax(0,1fr) 328px;gap:40px;align-items:stretch}
.app-column,.sidebar{display:flex;flex-direction:column;min-width:0}
.app-column,.sidebar:not(.is-collapsed){padding:clamp(12px,2vw,24px);border:1px solid #ffffffc0;border-radius:var(--radius);background:#f8fcffbd;box-shadow:0 8px 24px #52749409}
.app-column-head,.sidebar-head{display:flex;align-items:center;gap:12px;min-height:44px}
.app-column-head{flex-wrap:wrap}
.app-column-head h2{font-size:22px;font-weight:650;letter-spacing:.5px}
.app-column-head p{font-size:13px;color:var(--muted)}
/* iPhone-style paged app sections */
.page-tabs{display:flex;gap:6px;padding:5px;margin-top:6px;background:#ffffff6b;border:1px solid #ffffff70;border-radius:16px}
.page-tab{flex:1 1 auto;min-height:38px;padding:0 12px;border-radius:12px;background:transparent;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.page-tab.is-active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #385a7714}
.page-viewport{margin-top:18px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.page-viewport::-webkit-scrollbar{display:none}
.page-track{display:flex;align-items:flex-start;padding-bottom:6px}
.app-page{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always}
.page-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 20px;min-height:236px;align-content:start}
.page-dots{display:flex;justify-content:center;gap:8px;margin-top:auto;padding-top:12px}
.page-dot{display:grid;place-items:center;width:36px;min-height:44px;padding:0;border-radius:12px;background:transparent}
.page-dot::after{content:"";width:8px;height:8px;border-radius:100%;background:#7894ac66}
.page-dot.is-active::after{width:20px;border-radius:4px;background:var(--blue)}
.install-app{opacity:.82}
.install-app .app-tile{background:transparent;border:2px dashed #8fa9be;color:#5f788c;box-shadow:none}
.install-app .app-label{color:#5f788c}
.install-app:hover{opacity:1}
.run-list{display:flex;flex-direction:column;gap:8px}
.run-row{display:flex;align-items:center;gap:10px;background:#f8fcffbd;border:1px solid #ffffffc0;border-radius:18px;padding:8px 10px 8px 12px;box-shadow:0 6px 18px #52749409}
.run-open{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:transparent;text-align:left;padding:0}
.run-icon{display:flex;justify-content:center;align-items:center;width:34px;height:34px;border-radius:10px;background:var(--tile);color:var(--glyph);border:1px solid #ffffff66;flex:none}
.run-icon .od-icon{--od-icon-size:19px}
.run-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-stop{font-size:12px;color:var(--muted);background:#e8f0f7;border-radius:10px;min-height:32px;padding:0 12px;flex:none}
.run-empty{font-size:13px;color:var(--muted);background:#ffffff4d;border:1px dashed #ffffffb0;border-radius:16px;padding:14px 16px}
.sidebar-head{justify-content:space-between}
.sidebar-title{font-size:13px;font-weight:600;letter-spacing:2px;color:var(--muted)}
.sidebar-toggle{background:#ffffff6b;border:1px solid #ffffff70;border-radius:12px}
.sidebar-toggle .od-icon{--od-icon-size:18px;transition:transform var(--motion) ease}
.sidebar-body{display:flex;flex:1;flex-direction:column}
.sidebar .app-page{padding:4px}
.sidebar .page-tab{flex:1}
.widget-stack{display:flex;flex-direction:column;gap:12px}
.widget-card{margin:0}
.widget-clock{display:block;font-family:"Bahnschrift","Segoe UI",sans-serif;font-weight:300;letter-spacing:-2px;font-size:clamp(42px,4.2vw,52px);line-height:1.05;font-variant-numeric:tabular-nums;margin:14px 0 6px;white-space:nowrap}
.widget-date{display:block;font-size:14px;color:var(--muted)}
.widget-note{display:block;margin-top:14px;font-size:13px;color:var(--muted)}
.install-copy{font-size:14px;color:var(--muted);line-height:1.7}
.home-content.is-collapsed{grid-template-columns:minmax(0,1fr) 64px}
.sidebar.is-collapsed .sidebar-head{justify-content:center;padding:0}
.sidebar.is-collapsed .sidebar-title{display:none}
.sidebar.is-collapsed .sidebar-toggle{background:#ffffff8c;border-color:#ffffffb0;min-width:44px;min-height:44px}
.sidebar.is-collapsed .sidebar-toggle .od-icon{transform:rotate(180deg)}
body.dark .app-column,body.dark .sidebar:not(.is-collapsed),body.dark .sidebar-toggle{background:#263f58db;border-color:#52667a}
body.dark .sidebar.is-collapsed .sidebar-toggle{background:#33506c;border-color:#52667a}
body.dark .page-tabs{background:#263f58db;border-color:#52667a}
body.dark .page-tab.is-active{background:#33506c;color:#edf4ff;box-shadow:none}
body.dark .page-dot::after{background:#5d7891}
body.dark .page-dot.is-active::after{background:#9dbddb}
body.dark .run-row{background:#263f58db;border-color:#52667a}
body.dark .run-stop{background:#354f69;color:#edf4ff}
body.dark .run-empty{background:#2c465f;border-color:#4d6a83;color:#c6d6e5}
body.dark .install-app .app-tile{border-color:#6f8aa2;color:#a8bccd}

function setupPager(root){

  let pageWidth=viewport.clientWidth;
  function syncPage(index){
    currentPage=index;
    pages.forEach((page,i)=>{
      const selected=i===index;
      page.inert=!selected;

      dots.children[i].setAttribute('aria-current',String(selected));

    const behavior=matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth';

    tabs.children[index].onclick=()=>goPage(index);

    if(!viewport.clientWidth || viewport.clientWidth!==pageWidth)return;

    const width=viewport.clientWidth;
    if(width===pageWidth)return;
    pageWidth=width;
    if(width)viewport.scrollLeft=pages[currentPage].offsetLeft-pages[0].offsetLeft;

  syncPage(0);

if(active==='draw'){body.innerHTML='<div class="form-row"><label for="draw-color">画笔颜色</label><input id="draw-color" type="color" value="#233c50"><button id="clear-draw" class="secondary">清空画布</button><button id="save-draw" class="primary">下载画作</button></div><canvas id="canvas" class="drawing" width="1200" height="600" aria-label="自由绘画画布"></canvas>';const canvas=$('#canvas'),ctx=canvas.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=4;let drawing=false;const point=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(!drawing)return;ctx.strokeStyle=$('#draw-color').value;ctx.lineTo(...point(e));ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>drawing=false;$('#clear-draw').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);$('#save-draw').onclick=()=>{const a=document.createElement('a');a.download='PENS-画作.png';a.href=canvas.toDataURL();a.click()};}
if(active==='reading'){body.innerHTML='<article class="reading"><span class="section-label">PENS 随读 · 创作随笔</span><h2>给想法一点留白</h2><p>有时候，最好的开始不是完整的计划，而是一张空白的纸。</p><p>把刚刚想到的一句话写下来。画一条还不知道会通向哪里的线。让一个尚未成形的念头，在这里停留一会儿。</p><p>我们不必一次想清楚所有事情。留一点空间，下一步会慢慢出现。</p><p>现在，回到笔记，把你的第一个想法留下。</p><button class="primary" data-open="notes">开始记录</button></article>';}
if(['digitalhuman','voice','game','sudoku'].includes(active)){body.innerHTML=empty(active,appById(active)[1],'这个应用还在准备中，稍后就能在这里使用。')}
}
function drawMonth(){$('#month-name').textContent=`${year}年 ${month+1}月`;const grid=$('#month-grid');grid.innerHTML=['一','二','三','四','五','六','日'].map(d=>`<span class="week">${d}</span>`).join('');const start=(new Date(year,month,1).getDay()+6)%7;for(let i=0;i<start;i++)grid.insertAdjacentHTML('beforeend','<span></span>');for(let d=1;d<=new Date(year,month+1,0).getDate();d++)grid.insertAdjacentHTML('beforeend',`<span ${d===now.getDate()&&month===now.getMonth()&&year===now.getFullYear()?'class="today" aria-label="今天"':''}>${d}</span>`)}
function renderList(contact){const list=$('#item-list'),data=contact?contacts:tasks;list.innerHTML='';if(!data.length){list.innerHTML=empty(contact?'contacts':'reminders',contact?'还没有联系人':'今天，轻装开始',contact?'添加一位联系人，建立你的通讯录。':'添加一件想完成的小事。');return}data.forEach((item,i)=>{const row=document.createElement('div');row.className='list-row';if(!contact){const check=document.createElement('input');check.type='checkbox';check.checked=item.done;check.setAttribute('aria-label','完成 '+item.text);check.onchange=()=>{item.done=check.checked;persist('tasks',tasks);renderList(false)};row.append(check)}const text=document.createElement('div');text.className='od-field';const strong=document.createElement('span');strong.textContent=contact?item.name:item.text;strong.style.overflowWrap='anywhere';if(item.done)strong.style.textDecoration='line-through';text.append(strong);if(contact&&item.phone){const sub=document.createElement('small');sub.textContent=item.phone;text.append(sub)}row.append(text);const del=document.createElement('button');del.className='secondary';del.textContent='移除';del.onclick=()=>{data.splice(i,1);persist(contact?'contacts':'tasks',data);renderList(contact);$('#new-item').focus();toast('已移除')};row.append(del);list.append(row)})}
function renderFiles(photo){const list=$('#file-list'),data=photo?photos:files;list.innerHTML='';list.className=photo?'photo-grid':'';if(!data.length){list.className='';list.innerHTML=empty(photo?'photos':'files',photo?'你的美好，还未收录':'文件，从这里归拢',photo?'选择照片，建立本次会话的相册。':'选择本地文件，查看名称、大小并下载。');return}data.forEach(f=>{if(photo){const img=document.createElement('img');img.src=f.url;img.alt=f.name;list.append(img)}else{const row=document.createElement('div');row.className='list-row';const title=document.createElement('span');title.textContent=f.name;title.className='od-fill';title.style.overflowWrap='anywhere';const size=document.createElement('small');size.textContent=(f.size/1024).toFixed(1)+' KB';const a=document.createElement('a');a.textContent='下载';a.href=f.url;a.download=f.name;row.append(title,size,a);list.append(row)}})}
let focusSeconds=1500,focusRunning=false;function renderFocus(){if(active!=='focus')return;$('#focus-time').textContent=`${String(Math.floor(focusSeconds/60)).padStart(2,'0')}:${String(focusSeconds%60).padStart(2,'0')}`;$('#focus-state').textContent=focusRunning?'专注进行中':focusSeconds===0?'本次专注已完成':'25 分钟专注时间';$('#focus-toggle').textContent=focusRunning?'暂停':focusSeconds===1500?'开始专注':'继续';}setInterval(()=>{if(focusRunning){if(focusSeconds>0)focusSeconds--;if(focusSeconds===0){focusRunning=false;toast('专注完成，休息一下吧')}renderFocus()}},1000);
function search(){const query=$('#search-input').value.trim();const found=apps.filter(a=>a[1].includes(query)||a[0].includes(query.toLowerCase()));$('#search-results').innerHTML=found.map(appButton).join('');$('#search-empty').hidden=!!found.length}$('#search-launch').onclick=()=>{$('#search-input').value='';search();$('#search-dialog').showModal();$('#search-input').focus()};$('#search-input').oninput=search;$('#close-search').onclick=()=>$('#search-dialog').close();$('#close-install').onclick=()=>$('#install-dialog').close();$('#search-dialog').addEventListener('close',()=>$('#search-launch').focus());document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#search-dialog').open&&active)home()});
</script></body></html>
